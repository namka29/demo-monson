# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# --- Câu lệnh Docker thường dùng (từ thư mục gốc dự án) ---
# Lần đầu / cài đặt đầy đủ:     ./scripts/docker-setup.sh
# Bật stack:                    docker compose up -d
# Tắt stack:                    docker compose down
# Xem log:                      docker compose logs -f
# Vào container PHP:          docker compose exec app sh
# Artisan:                      docker compose exec app php artisan migrate
# npm / Vite build:             ./build-frontend.sh
#               hoặc:          ./scripts/docker-npm.sh run build
# Vite dev (port 5173):          ./scripts/docker-npm-dev.sh
# (tương đương)                  docker compose --profile node run --rm --no-deps node npm install
# Một dòng (up + build + migrate, khi vendor đã có):
#   docker compose up -d && docker compose --profile node run --rm node sh -lc "npm install && npm run build" && docker compose exec app php artisan migrate --force
# Copy env cho Docker:          cp .env.docker .env
#
# ⚠️  Container `app` chỉ có PHP-FPM — KHÔNG có Node/npm.
#     Sai:  docker compose exec app npm install
#     Đúng: ./scripts/docker-npm.sh install   hoặc   docker compose --profile node run --rm --no-deps node npm install
#
# All services share the default Compose bridge network — no explicit networks: block (avoids noisy IDE lint in some setups).
name: tourist_web

services:
  # PHP-FPM — không bao gồm npm (xem service `node` + profile node).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tourist_web_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - tourist_vendor:/var/www/html/vendor
      - tourist_node_modules:/var/www/html/node_modules
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      # Khớp docker/php/conf.d/uploads.ini (32M) — Livewire upload tạm / Filament FileUpload
      LIVEWIRE_TEMP_UPLOAD_MAX_KB: "${LIVEWIRE_TEMP_UPLOAD_MAX_KB:-32768}"
      LIVEWIRE_PAYLOAD_MAX_BYTES: "${LIVEWIRE_PAYLOAD_MAX_BYTES:-10485760}"
      DB_CONNECTION: "mysql"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-tourist_web}"
      DB_USERNAME: "${DB_USERNAME:-tourist}"
      DB_PASSWORD: "${DB_PASSWORD:-tourist_dev}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/vendor/autoload.php') ? 0 : 1);"]
      interval: 4s
      timeout: 5s
      retries: 60
      start_period: 120s

  nginx:
    image: nginx:alpine
    container_name: tourist_web_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - tourist_vendor:/var/www/html/vendor
      - tourist_node_modules:/var/www/html/node_modules
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: tourist_web_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-tourist_web}"
      MYSQL_USER: "${DB_USERNAME:-tourist}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-tourist_dev}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12

  # npm: ./scripts/docker-npm.sh install | ./scripts/docker-npm.sh run build | ./scripts/docker-npm-dev.sh
  node:
    image: node:22-alpine
    container_name: tourist_web_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - tourist_node_modules:/var/www/html/node_modules
    tty: true
    profiles:
      - node

volumes:
  mysql_data:
  tourist_vendor:
  tourist_node_modules:
