server {
    listen 80;
    listen [::]:80;

    root /var/www/html/public;

    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        # Preserve Host header port (e.g. localhost:8080). Default fastcgi uses $host without port and breaks Laravel URLs / Livewire.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTPS off;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Serve real files from public/; otherwise Laravel routes (Livewire / Filament vendor assets are not physical files).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri /index.php$is_args$args;
        expires max;
        log_not_found off;
        access_log off;
    }
}
